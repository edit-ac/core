[package]
name = "editac-formats-wasm"
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
publish = false
[workspace]
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
editac-formats = { path = "../editac-formats", features = ["rtf-import", "rtf-export", "table-text-import", "table-text-export", "docx-codecs", "odt-export", "odt-import", "epub-export", "epub-import", "pdf-export"] }
editac-core = { path = "../editac-core" }
editac-session = { path = "../editac-session" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.152"
wasm-bindgen = "=0.2.129"
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
