[package]
name = "editac-ffi"
description = "Bounded native preparation bridge; not a mobile SDK"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[features]
bindgen = ["uniffi/cli"]
# Diagnostic JSON spans only; never part of a distributed default artifact.
fitness-trace = []

[[bin]]
name = "editac-uniffi-bindgen"
path = "src/bin/bindgen.rs"
required-features = ["bindgen"]

[dependencies]
editac-html = { path = "../editac-html" }
editac-core = { path = "../editac-core" }
editac-markdown = { path = "../editac-markdown" }
editac-diff = { path = "../editac-diff" }
editac-session = { path = "../editac-session", features = ["native-store"] }
yrs.workspace = true
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.152"
thiserror = "=2.0.21"
uniffi = "=0.32.2"

[dev-dependencies]
editac-markdown-wasm = { path = "../editac-markdown-wasm" }

[lints]
workspace = true
