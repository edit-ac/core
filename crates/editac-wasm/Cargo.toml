[package]
name = "editac-wasm"
description = "edit.ac semantic engine WASM bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
foundation-fixture = []
fitness-trace = []

[dependencies]
editac-html = { path = "../editac-html", default-features = false }
editac-core = { path = "../editac-core" }
wasm-bindgen.workspace = true
yrs.workspace = true
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.152"

[lints]
workspace = true
