[package]
name = "editac-formats-native"
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
publish = false

[workspace]

[features]
qualification = []
odt-import = ["editac-formats/odt-import"]
odt-export = ["editac-formats/odt-export"]
pdf-export = ["editac-formats/pdf-export"]
epub-import = ["editac-formats/epub-import"]
epub-export = ["editac-formats/epub-export"]
docx-import = ["editac-formats/docx-codecs", "editac-formats/jobs"]
docx-export = ["editac-formats/docx-codecs", "editac-formats/jobs"]

[dependencies]
editac-formats = { path = "../editac-formats", default-features = false, features = ["rtf-import", "rtf-export", "table-text-import", "table-text-export"] }
editac-core = { path = "../editac-core" }
editac-session = { path = "../editac-session" }
serde_json = "=1.0.152"
sha2 = "=0.10.9"
