[package]
name = "editac-formats"
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
publish = false
description = "Optional local conversion capability and completeness boundary"

# Independent optional workspace; shared Cargo/API ownership stays unchanged.
# Neither the minimum editor nor this registry depends on a converter or font.
[workspace]

[lints.rust]
unsafe_code = "forbid"

[features]
default = []
pdf-export = ["pdf-probe", "jobs", "krilla/raster-images", "dep:flate2"]
pdf-probe = ["dep:krilla", "dep:rustybuzz"]
container-codecs = ["dep:zip", "dep:quick-xml", "dep:flate2"]
docx-codecs = ["container-codecs", "dep:docx-rs"]
odt-import = ["container-codecs", "jobs"]
odt-export = ["container-codecs", "jobs"]
jobs = ["dep:editac-core", "dep:editac-session", "dep:sha2"]

[[test]]
name = "odt_export"
required-features = ["odt-export"]

[[example]]
name = "odt_export"
required-features = ["odt-export"]

[[example]]
name = "odt_import"
required-features = ["odt-import"]

[[test]]
name = "odt_import"
required-features = ["odt-import"]

[[test]]
name = "pdf_export"
required-features = ["pdf-export"]

[[test]]
name = "pdf_structure"
required-features = ["pdf-export"]

[[test]]
name = "pdf_probe"
required-features = ["pdf-probe"]

[[example]]
name = "pdf_document"
required-features = ["pdf-export"]

[[example]]
name = "pdf_probe"
required-features = ["pdf-probe"]

[[test]]
name = "docx_export"
required-features = ["docx-codecs", "jobs"]

[[example]]
name = "docx_export"
required-features = ["docx-codecs", "jobs"]

[[test]]
name = "docx_import_structure"
required-features = ["docx-codecs", "jobs"]

[[example]]
name = "docx_import_structure"
required-features = ["docx-codecs", "jobs"]

[[test]]
name = "docx_import_text"
required-features = ["docx-codecs", "jobs"]

[[example]]
name = "docx_import_text"
required-features = ["docx-codecs", "jobs"]

[[test]]
name = "docx_probe"
required-features = ["docx-codecs"]

[[test]]
name = "container_limits"
required-features = ["docx-codecs", "jobs"]

[[example]]
name = "docx_probe"
required-features = ["docx-codecs"]

[[example]]
name = "container_probe"
required-features = ["docx-codecs", "jobs"]

[dependencies]
krilla = { version = "=0.8.2", default-features = false, features = ["simple-text"], optional = true }
rustybuzz = { version = "=0.20.1", optional = true }
# Reuse the already-qualified ZIP transitive codec with the same pure-Rust backend.
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs"], optional = true }
docx-rs = { version = "=0.4.22", default-features = false, optional = true }
zip = { version = "=8.6.0", default-features = false, features = ["deflate"], optional = true }
quick-xml = { version = "=0.41.0", default-features = false, features = ["encoding"], optional = true }
editac-core = { path = "../editac-core", optional = true }
editac-session = { path = "../editac-session", optional = true }
sha2 = { version = "=0.10.9", optional = true }

[dev-dependencies]
serde_json = "=1.0.152"
