name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Select npm
        run: npm install --global npm@11.17.0 --ignore-scripts
      - name: Select Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --target wasm32-unknown-unknown
      - name: Install locked development dependencies
        run: npm ci --ignore-scripts
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked
      - name: Check workspace, protocol and structural schema
        run: npm run check
      - name: Install matching WASM binding generator
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Install headless Chromium for WASM loading checks
        run: npx --no-install playwright install --with-deps --only-shell chromium
      - name: Check compiled WASM loading and packed consumer
        run: npm run check:wasm
